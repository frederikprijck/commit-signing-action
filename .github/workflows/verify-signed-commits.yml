name: Verify Signed Commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write # Required for Comments AND Labels

jobs:
  check-signatures:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Commit Signatures
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            
            // --- CONFIGURATION ---
            const LABEL_UNSIGNED = 'commits:unverified';
            const LABEL_SIGNED = 'commits:verified';
            const COMMENT_HEADER = '<!-- Verify Signed Commits -->';
            // ---------------------

            // 1. Fetch all commits in the PR
            const commits = await octokit.paginate(octokit.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number
            });

            const unsignedCommits = commits.filter(c => c.commit.verification.verified === false);
            
            // 2. Fetch existing comments to manage the bot's history
            const comments = await octokit.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });

            const existingComment = comments.data.find(c => c.body.includes(COMMENT_HEADER));

            // 3. Helper function to safely remove a label (ignores errors if label doesn't exist)
            async function removeLabel(name) {
              try {
                await octokit.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pull_number,
                  name: name
                });
              } catch (error) {
                // Ignore 404 errors (label didn't exist)
                if (error.status !== 404) throw error;
              }
            }

            // --- SCENARIO A: UNSIGNED COMMITS FOUND ---
            if (unsignedCommits.length > 0) {
              // A1. Manage Labels
              await octokit.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: [LABEL_UNSIGNED]
              });
              await removeLabel(LABEL_SIGNED);

              // A2. Manage Comments
              const commitList = unsignedCommits.map(c => `- ${c.sha.substring(0, 7)}: ${c.commit.message.split('\n')[0]}`).join('\n');
              const body = `${COMMENT_HEADER}
              ## ⚠️ Unverified Commits Detected

              There appear to be unverified commits included in this PR. We can not merge this PR prior to all commits being verified to ensure authenticity.
              
              The following commits are not verified:
              
              ${commitList}
              
              Please ensure the above commits are signed with a GPG or S/MIME key associated with your GitHub account.

              [Learn how to sign and verify commits](https://docs.github.com/en/authentication/managing-commit-signature-verification/about-commit-signature-verification)`;

              if (existingComment) {
                await octokit.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body
                });
              } else {
                await octokit.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body
                });
              }
              
              core.setFailed(`${unsignedCommits.length} commit(s) are not signed.`);
            } 
            
            // --- SCENARIO B: ALL COMMITS SIGNED ---
            else {
              // B1. Manage Labels
              await octokit.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: [LABEL_SIGNED]
              });
              await removeLabel(LABEL_UNSIGNED);

              // B2. Manage Comments
              if (existingComment) {
                const body = `${COMMENT_HEADER}
              ## ✅ All Commits Verified
              Thank you, all commits in this PR are now verified.`;
                
                await octokit.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body
                });
              }
            }